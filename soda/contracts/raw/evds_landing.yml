# Raw landing checks. Run after load, before dbt.
dataset: warehouse/warehouse/raw/evds_landing

checks:
  - row_count:
      name: Table has rows
      threshold:
        must_be_greater_than: 0
  - freshness:
      name: Last ingestion is less than 24 hours old
      column: ingested_at
      threshold:
        unit: hour
        must_be_less_than: 24
        level: warn

columns:
  - name: group_name
    checks:
      - missing:
  - name: dt
    checks:
      - missing:
  - name: source
    checks:
      - missing:
      - invalid:
          valid_values: ["evds", "frankfurter"]
  - name: ingested_at
    checks:
      - missing:
