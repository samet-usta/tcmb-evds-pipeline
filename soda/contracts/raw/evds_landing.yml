# Raw landing checks. Run after load, before dbt. Freshness: dbt source freshness.
# Rules not covered by DB constraints (PK, NOT NULL) live here.
dataset: warehouse/warehouse/raw/evds_landing

# ds: run date (YYYY-MM-DD). Passed by run_contract.sh. The default is invalid on purpose: a missing ds must fail.
variables:
  ds:
    default: "ds-not-set"

checks:
  # A: kolon adı ve tip değişirse yakala
  - schema:
  - row_count:
      name: Table has rows
      threshold:
        must_be_greater_than: 0
  # B: items boş array (warn: hafta sonu, tatil, yayın gecikmesinde boş dönüş normal)
  - failed_rows:
      name: items is a non-empty array
      qualifier: items_non_empty
      threshold:
        must_be: 0
        level: warn
      expression: CASE WHEN jsonb_typeof(items) = 'array' THEN jsonb_array_length(items) = 0 ELSE true END
  # C: source ve fallback_reason tutarlı olmalı
  - failed_rows:
      name: fallback_reason matches source
      qualifier: fallback_consistent
      expression: NOT ((source = 'evds' AND fallback_reason IS NULL) OR (source = 'frankfurter' AND fallback_reason IS NOT NULL))
  # D: dt gelecekte olamaz (UTC/TR farkı için 1 gün tolerans)
  - failed_rows:
      name: dt is not in the future
      qualifier: dt_not_future
      expression: dt > (current_date + 1)
  # E: pencerede (ds-30 .. ds) grubun ilk dt'sinden ds'e kadar her iş günü landing'de olmalı
  - metric:
      name: Groups with dt gaps
      query: |
        SELECT COUNT(*)
        FROM (
          SELECT g.group_name, c.dt
          FROM (
            SELECT group_name, MIN(dt) AS first_dt
            FROM raw.evds_landing
            WHERE dt BETWEEN DATE '${var.ds}' - 30 AND DATE '${var.ds}'
            GROUP BY group_name
          ) g
          JOIN raw.business_calendar c
            ON c.is_business_day
           AND c.dt BETWEEN g.first_dt AND DATE '${var.ds}'
          LEFT JOIN raw.evds_landing l
            ON l.group_name = g.group_name AND l.dt = c.dt
          WHERE l.dt IS NULL
        ) missing
      threshold:
        must_be: 0
  # F: s3_key group_name ve dt ile uyumlu olmalı
  - failed_rows:
      name: s3_key matches group_name and dt
      qualifier: s3_key_consistent
      expression: s3_key <> 'raw/' || group_name || '/dt=' || dt::text || '/data.json'

  # G: EVDS cevabında hiç seri değeri yoksa (tüm değerler null) warn.
  # Kısmi null normal: hafta sonu ve tatil satırları null döner.
  - failed_rows:
      name: items has at least one non-null value
      qualifier: items_not_all_null
      threshold:
        must_be: 0
        level: warn
      expression: >-
        CASE WHEN jsonb_array_length(items) = 0 THEN false
        ELSE NOT EXISTS (
        SELECT 1
        FROM jsonb_array_elements(items) AS item, jsonb_each(item) AS kv
        WHERE kv.key NOT IN ('Tarih', 'UNIXTIME')
        AND jsonb_typeof(kv.value) <> 'null'
        ) END

columns:
  - name: group_name
    data_type: text
    checks:
      - missing:
      - invalid:
          valid_values: ["policy_rate", "funding_cost", "fx_rates", "deposit_rates", "deposit_volumes", "loan_rates", "loan_volumes"]
  - name: dt
    data_type: date
    checks:
      - missing:
  - name: source
    data_type: text
    checks:
      - missing:
      - invalid:
          valid_values: ["evds", "frankfurter"]
  - name: ingested_at
    data_type: timestamp with time zone
    checks:
      - missing:
  - name: fallback_reason
    data_type: text
  - name: s3_key
    data_type: text
  - name: request_params
    data_type: jsonb
  - name: items
    data_type: jsonb
  - name: loaded_at
    data_type: timestamp with time zone
