[pytest]
testpaths = tests
pythonpath = .
addopts = -ra -m "not integration"
# /opt/pipeline is not writable for the airflow user.
cache_dir = /tmp/.pytest_cache
markers =
    integration: needs running LocalStack (run with -m integration)
# requests 2.32.5 warns about chardet 6.x. chardet is pinned by Airflow
# constraints (needed by gcloud-aio-auth), so it cannot be removed here.
# Match by message: a class-based filter imports requests too early.
filterwarnings =
    ignore:urllib3 .* or chardet .*doesn't match a supported version
