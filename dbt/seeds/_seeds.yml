version: 2

seeds:
  - name: series_metadata
    description: >
      Series metadata generated from config/series.yaml by
      src/tools/generate_series_seed.py. Do not edit by hand.
      One row per series.
    config:
      column_types:
        series_code: text
        series_name: text
        group_name: text
        frequency: text
        unit: text
        measure_type: text
        max_fill_days: integer
        available_from: date
        fallback_source: text
        fallback_base_currency: text
        fallback_quote_currency: text
    columns:
      - name: series_code
        description: EVDS series code (e.g. TP.DK.USD.A.YTL). Primary key.
        data_tests:
          - unique
          - not_null
      - name: series_name
        description: English series name.
        data_tests:
          - not_null
      - name: group_name
        description: Series group in config (e.g. fx_rates).
        data_tests:
          - not_null
      - name: frequency
        description: business_daily, weekly_friday or monthly.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["business_daily", "weekly_friday", "monthly"]
      - name: unit
        description: Value unit (TRY, percent, TRY_thousand).
        data_tests:
          - not_null
      - name: measure_type
        description: rate (not summed) or volume (summed).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["rate", "volume"]
      - name: max_fill_days
        description: Max days to forward fill a value. Null means no fill (volume series).
      - name: available_from
        description: First date with data in EVDS.
        data_tests:
          - not_null
      - name: fallback_source
        description: Fallback source (frankfurter) or null.
        data_tests:
          - accepted_values:
              arguments:
                values: ["frankfurter"]
      - name: fallback_base_currency
        description: Fallback base currency (USD, EUR, GBP) or null.
      - name: fallback_quote_currency
        description: Fallback quote currency (TRY) or null.

  - name: tr_holidays
    description: >
      Turkish public holidays generated by
      src/tools/generate_tr_holidays_seed.py (Python holidays package, TR).
      Range: 2000 to next year. Half days (arife) are not included.
      Do not edit by hand.
    config:
      column_types:
        holiday_date: date
        holiday_name: text
    columns:
      - name: holiday_date
        description: Holiday date. Primary key.
        data_tests:
          - unique
          - not_null
      - name: holiday_name
        description: Holiday name in Turkish.
        data_tests:
          - not_null
