version: 2

models:
  - name: dim_date
    description: >
      Calendar dimension. One row per day. Business days exclude weekends
      and Turkish public holidays (seed tr_holidays).
    columns:
      - name: date_day
        description: Calendar date. Primary key.
      - name: year
        description: Calendar year.
      - name: quarter
        description: Calendar quarter (1-4).
      - name: month
        description: Month number (1-12).
      - name: month_name
        description: Month name in English.
      - name: week_of_year
        description: ISO week number.
      - name: day_of_week
        description: ISO day of week (1 = Monday, 7 = Sunday).
      - name: day_name
        description: Day name in English.
      - name: is_weekend
        description: True on Saturday and Sunday.
      - name: is_holiday
        description: True on a Turkish public holiday.
      - name: holiday_name
        description: Holiday name. Null when is_holiday is false.
      - name: is_business_day
        description: True when the day is not a weekend and not a holiday.

  - name: dim_series
    description: >
      Series dimension. One row per EVDS series. Built from seed
      series_metadata, which is generated from config/series.yaml.
    columns:
      - name: series_code
        description: EVDS series code (e.g. TP.DK.USD.A.YTL). Primary key.
      - name: series_name
        description: Series name.
      - name: group_name
        description: Series group (e.g. fx_rates, deposit_rates).
      - name: frequency
        description: Publication frequency (business_daily, weekly_friday, monthly).
      - name: unit
        description: Unit of value (e.g. TRY, percent, TRY_thousand).
      - name: measure_type
        description: rate or volume. Selects the fact table.
      - name: max_fill_days
        description: Maximum number of days a value is forward filled in fct_rates_daily.
      - name: available_from
        description: First date with data in EVDS. Lower bound for backfill.
      - name: has_fallback
        description: True when the series has a fallback source.
      - name: fallback_source
        description: Fallback source name (frankfurter). Null when has_fallback is false.

  - name: fct_rates
    description: >
      Rate observations at source frequency. One row per series and
      observation date. Incremental merge with a lookback window on ingested_at.
    columns:
      - name: series_code
        description: EVDS series code. Part of the primary key.
      - name: observation_date
        description: Observation date. Monthly series use the first day of the month. Part of the primary key.
      - name: value
        description: Observed value. Never null.
      - name: source
        description: Data source (evds or frankfurter).
      - name: dt
        description: Landing partition date (Airflow logical date) of the selected file.
      - name: ingested_at
        description: API fetch time (UTC) of the selected file.
      - name: dbt_updated_at
        description: Time when dbt last wrote the row.

  - name: fct_volumes
    description: >
      Volume observations at source frequency. Same structure and load logic
      as fct_rates. Series with measure_type volume.
    columns:
      - name: series_code
        description: EVDS series code. Part of the primary key.
      - name: observation_date
        description: Observation date. Part of the primary key.
      - name: value
        description: Observed value. Never null.
      - name: source
        description: Data source (evds).
      - name: dt
        description: Landing partition date (Airflow logical date) of the selected file.
      - name: ingested_at
        description: API fetch time (UTC) of the selected file.
      - name: dbt_updated_at
        description: Time when dbt last wrote the row.

  - name: fct_rates_daily
    description: >
      Daily rate series with forward fill. One row per rate series and day,
      from the first observation to var as_of_date. A value is filled for
      at most max_fill_days days after the last observation.
    columns:
      - name: series_code
        description: EVDS series code. Part of the primary key.
      - name: date_day
        description: Calendar date. Part of the primary key.
      - name: value
        description: Observed value on this day. Null when there is no observation.
      - name: value_filled
        description: Observed value or the last observation within max_fill_days. Null after the limit.
      - name: is_filled
        description: True when value is null and value_filled comes from an earlier observation.
      - name: filled_from_date
        description: Observation date of value_filled. Null after the limit.
      - name: source
        description: Source of the observation used in value_filled. Null after the limit.
      - name: dbt_updated_at
        description: Time when dbt last wrote the row.
